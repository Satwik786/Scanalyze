<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Discover Products - Scanalyze</title>

   <link rel="icon" href="../images/scani.ico" type="image/png">
  <link rel="apple-touch-icon" href="../images/scani.ico">
  
  <link rel="stylesheet" href="../css/main-page-discover.css" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>

  <header class="header">
    <div class="logo"><a href="home-page.html">Scanalyze</a></div>
    <h2>Discover Products</h2>
  </header>

  <main>
    <!-- Search + Filter controls -->
    <div class="discover-controls">
      <div class="search-filter-wrapper">
        <!-- Search Bar -->
        <div class="search-bar">
          <input type="text" id="searchInput" placeholder="Search for foods..." />
          <button id="searchBtn">Search</button>
        </div>

        <!-- Filter Button -->
        <div class="filter-container">
          <button id="filterBtn" class="filter-btn">
            <i class="fas fa-filter"></i>
          </button>

          <!-- Filter Dropdown -->
          <div id="filterOptions" class="filter-options hidden">
            <label><input type="radio" name="diet" value="all" checked /> All</label>
            <label><input type="radio" name="diet" value="veg" /> Veg</label>
            <label><input type="radio" name="diet" value="nonveg" /> Non-Veg</label>
          </div>
        </div>
      </div>
    </div>

    <!-- Results -->
    <div id="discoverResults" class="results-grid"></div>
  </main>

  <script type="module" src="../js/discover-handler.js"></script>
</body>
</html>
