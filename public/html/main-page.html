<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TruthIn - Home</title>
  <link rel="stylesheet" href="main page.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Header -->
  <header class="main-header">
    <div class="logo">Scanalyze</div>
    <nav class="nav-links">
      <a href="#"><i class="fas fa-house"></i> Home</a>
      <a href="#"><i class="fas fa-search"></i> Search</a>
      <a href="#"><i class="fas fa-layer-group"></i> Categories</a>
      <a href="#"><i class="fas fa-upload"></i> Upload</a>
      <a href="#"><i class="fas fa-list"></i> Shop List</a>
    </nav>
    <div class="user-profile">
      <i class="fas fa-user-circle fa-2x"></i>
      <span>Guest</span>
    </div>
  </header>

  <!-- Search -->
  <section class="search-bar">
    <input type="text" placeholder="Search for Packaged Foods..." />
  </section>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-text">
      <h1>Want to know what's in your Food?<br><span>Scanalyze it.</span></h1>
      <button>Scan Now</button>
    </div>
    <div class="hero-icon">
      <i class="fas fa-barcode fa-7x"></i>
    </div>
  </section>

  <!-- Top-rated Healthy Picks -->
  <section class="healthy-picks">
    <h2>Top-rated Healthy Picks</h2>
    <div class="card-grid">
      <div class="card">
        <i class="fas fa-popcorn fa-3x"></i>
        <p>Mindful Munch</p>
      </div>
      <div class="card">
        <i class="fas fa-mug-hot fa-3x"></i>
        <p>Feel-Good Sips</p>
      </div>
    </div>
  </section>

  <!-- Categories -->
  <section class="categories">
    <h2>All Categories</h2>
    <div class="card-grid categories-grid">
      <div class="card"><i class="fas fa-cookie-bite fa-2x"></i><p>Snacks</p></div>
      <div class="card"><i class="fas fa-bowl-rice fa-2x"></i><p>Cereal</p></div>
      <div class="card"><i class="fas fa-glass-water fa-2x"></i><p>Drinks</p></div>
      <div class="card"><i class="fas fa-cheese fa-2x"></i><p>Dairy</p></div>
      <div class="card"><i class="fas fa-wine-glass-alt fa-2x"></i><p>Juices</p></div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-left">
      <a href="#">About</a> | <a href="#">Contact</a> | <a href="#">Terms</a>
    </div>
    <div class="footer-right">
      <span>© 2025 Scanalyze</span>
    </div>
  </footer>
</body>
</html>
