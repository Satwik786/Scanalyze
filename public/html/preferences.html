<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Preferences</title>

  <link rel="icon" type="image/png" sizes="16x16" href="/images/scanalyze.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/scanalyze.png">

  <link rel="stylesheet" href="/css/preferences.css">
</head>
<body>
  <div class="container">
    <h1>Tell us about you</h1>

    <!-- 👤 Name input -->
    <div class="name-section">
      <label for="userName"><strong>Your Name:</strong></label><br>
      <input type="text" id="userName" placeholder="Enter your name" required>
    </div>

    <h2>Select Allergies / Sensitivities</h2>

    <p>
      Logged in as: <strong id="user-email" style="color: #007BFF;"></strong>
    </p>

    <form id="prefsForm">
      <div class="preference-options">
        <!-- Common allergens -->
        <label><input type="checkbox" value="gluten"> Gluten</label>
        <label><input type="checkbox" value="dairy"> Dairy</label>
        <label><input type="checkbox" value="nuts"> Nuts</label>
        <label><input type="checkbox" value="soy"> Soy</label>
        <label><input type="checkbox" value="egg"> Egg</label>
        <label><input type="checkbox" value="shellfish"> Shellfish</label>
        <label><input type="checkbox" value="fish"> Fish</label>
        <label><input type="checkbox" value="sesame"> Sesame</label>
        <label><input type="checkbox" value="sulfites"> Sulfites</label>
        <label><input type="checkbox" value="peanuts"> Peanuts</label>
        <label><input type="checkbox" value="mustard"> Mustard</label>
        <label><input type="checkbox" value="lupin"> Lupin</label>
        <label><input type="checkbox" value="celery"> Celery</label>
      </div>

      <button type="submit" id="prefsSubmit">Save Preferences</button>
    </form>

    <div id="preference-warning"></div>
    <div id="save-status"></div>
  </div>

  <script src="../js/preferences.js"></script>
</body>
</html>
