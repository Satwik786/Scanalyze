<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Info</title>

  <!-- ✅ Link to the correct CSS file -->
  <link rel="stylesheet" href="../css/product-page-style.css" />
</head>
<body>

  <!-- Product modal -->
  <div id="product-modal" class="modal">
    <div class="modal-content">
      <span class="modal-close" aria-label="Close">&times;</span>
      <img id="modal-img" alt="Product Image" />
      <h2 id="modal-name"></h2>
      <p id="modal-brand"></p>
      <p id="modal-nutrition"></p>
    </div>
  </div>

  <!-- ✅ Link to your JS -->
  <script src="../js/product.js"></script>
</body>
</html>
