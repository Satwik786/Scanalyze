<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Scanalyze | Login</title>

  <link rel="icon" type="image/png" sizes="16x16" href="/images/scanalyze.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/scanalyze.png">

  <link rel="stylesheet" href="../css/login-style.css" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>
  <div class="login-container">
    <div class="scanner-header">
      <h1 class="app-name">Scanalyze</h1>
    </div>

    <div class="login-box">
      <h2>Get Started</h2>
      <p>Using your mobile or email</p>

      <div class="input-wrapper">
        <input type="text" id="inputField" placeholder="Email or Mobile Number" />
      </div>

      <button class="verify-btn">Verify & Continue</button>

      <div class="divider">OR</div>

      <button class="guest-btn">
        <img src="https://img.icons8.com/material-outlined/24/333/user--v1.png" alt="Guest Icon" />
        Explore as Guest
      </button>

      <div class="footer">
        ©2025 Scanalyze
        <!-- By continuing, you agree to our
        <a href="#">Terms</a> & <a href="#">Privacy Policy</a> -->
      </div>
    </div>
  </div>

  <!-- Go up from /html/ to /js/ -->
  <script type="module" src="/js/login.js"></script>

</body>
</html>
